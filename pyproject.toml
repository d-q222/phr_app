# NOTE: target-version matches the actual .venv interpreter. The venv was upgraded from
# 3.9.6 to 3.12 on 2026-08-01 (see docs/adr/ and the migration slice-1 work), so pyupgrade
# may now rewrite to 3.12 syntax (e.g. `datetime.UTC`) that the runtime can execute.
# Keep this in sync with the interpreter — a target ahead of the runtime breaks the suite.
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", ".pytest_cache"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade,
# B = bugbear, F401 = unused imports (the "irrelevant code" signal).
# C901/PLR09xx = the mechanical proxies for the AGENTS.md §6.2 "structure has grown"
# signals: over-complex functions, too many args, sprawling functions.
select = ["E", "F", "I", "UP", "B", "C901", "PLR0913", "PLR0915"]
ignore = ["E501"]  # line length handled by the formatter, not enforced as an error

[tool.ruff.lint.mccabe]
max-complexity = 12  # default 10; +2 headroom for this codebase's branchy UI handlers

[tool.ruff.lint.pylint]
# max-args 7 (default 5) fits the person_id + date-range + filters + db_path idiom;
# genuine outliers (8+ args, 60+ statements) still fail. Pre-existing violators are
# grandfathered with line-level `# noqa` — new sprawl fails, old debt stays visible.
max-args = 7
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# Tests may take many fixture args and be long; the complexity gate targets app/service code.
"tests/*" = ["PLR0913", "PLR0915"]

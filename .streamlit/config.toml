# The app's visual identity lives here, not in a stylesheet: Streamlit exposes these as first-class
# theme tokens, so restyling its internals through private selectors (`.stApp`, BaseWeb popovers)
# is both unnecessary and fragile -- those selectors change between releases. See `APP_CSS` in
# app.py for what still has to be CSS, and why.
[theme]
primaryColor = "#16705c"          # buttons, focus rings, selected st.pills, active st.tabs indicator
backgroundColor = "#f6f8f7"
# Not widget fills -- measured, the select wrapper resolves to backgroundColor. Streamlit documents
# this as the fill for interactive widgets, and dataframe headers use a mix of it and backgroundColor.
secondaryBackgroundColor = "#ffffff"
textColor = "#17211d"
borderColor = "#d9e1dd"           # expanders, widget borders; dataframes inherit this
baseRadius = "8px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#eef4f1"
